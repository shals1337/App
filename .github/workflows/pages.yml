name: Deploy OddsCalc to GitHub Pages

# Gør appen live GRATIS på GitHub Pages.
# - Bygger friske odds + resultater HVIS repo-secret ODDS_API_KEY findes.
# - Ellers deployes de data der allerede ligger i football-odds/web
#   (så siden virker med det samme, også før du har lagt en API-nøgle ind).
# - Uploader football-odds/web som selve site-roden, så index.html og
#   data.json ligger side om side (appens auto-refresh henter data.json).
#
# SÅDAN TÆNDER DU DEN (engangs, i GitHub-webben):
#   1) Settings → Pages → Build and deployment → Source = "GitHub Actions"
#   2) (valgfrit, for live-odds) Settings → Secrets and variables → Actions
#      → New repository secret → navn: ODDS_API_KEY, værdi: din nøgle
#   3) Kør workflowen: Actions → "Deploy OddsCalc to GitHub Pages" → Run workflow
#      (den kører også af sig selv hver 12. time og ved push til branchen).

on:
  push:
    branches: ["claude/python-football-odds-calculator-tvbl26", "main"]
    paths:
      - "football-odds/web/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 */12 * * *"   # hver 12. time — friske odds/facit (kræver ODDS_API_KEY)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch fresh odds + build (kun hvis ODDS_API_KEY er sat)
        working-directory: football-odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "Ingen ODDS_API_KEY — deployer eksisterende data.json (ingen frisk hentning)."
            exit 0
          fi
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, sys
          key = os.environ["ODDS_API_KEY"]
          # Hold dig til få ligaer for at spare gratis-kvoten (500 credits/md).
          leagues = [
              "soccer_epl", "soccer_spain_la_liga", "soccer_italy_serie_a",
              "soccer_germany_bundesliga", "soccer_denmark_superliga",
          ]
          odds, scores = [], []
          for lg in leagues:
              u = "https://api.the-odds-api.com/v4/sports/%s/odds?%s" % (
                  lg, urllib.parse.urlencode({
                      "apiKey": key, "regions": "eu",
                      "markets": "h2h,totals", "oddsFormat": "decimal"}))
              try:
                  with urllib.request.urlopen(u, timeout=40) as r:
                      odds += json.loads(r.read())
              except Exception as e:
                  print("odds", lg, "fejl", e, file=sys.stderr)
              s = "https://api.the-odds-api.com/v4/sports/%s/scores?%s" % (
                  lg, urllib.parse.urlencode({"apiKey": key, "daysFrom": 3}))
              try:
                  with urllib.request.urlopen(s, timeout=40) as r:
                      scores += json.loads(r.read())
              except Exception as e:
                  print("scores", lg, "fejl", e, file=sys.stderr)
          json.dump(odds, open("all_soccer.json", "w"))
          json.dump(scores, open("all_scores.json", "w"))
          print("hentede", len(odds), "kampe,", len(scores), "resultater")
          PY
          python web/build.py all_soccer.json --scores all_scores.json

      - name: Commit fresh data (hvis noget ændrede sig)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "Ingen nøgle — intet nyt at committe."
            exit 0
          fi
          git config user.name "oddscalc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add football-odds/web/index.html football-odds/web/data.json \
                  football-odds/web/history.json football-odds/web/tips.json || true
          git commit -m "Auto-update odds data" || echo "ingen ændringer"
          git push || echo "push sprunget over"

      - name: Upload site (football-odds/web som rod)
        uses: actions/upload-pages-artifact@v3
        with:
          path: football-odds/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
